<!-- @dsCard group="Figures" height=760 subtitle="sliders for k, c and R driving a particle figure" -->
<div class="si-band si-band--ink" style="display:flex;justify-content:center">
  <figure class="si-plate" style="margin:0;width:340px">
    <div class="si-plate__shadow" data-si-tear="43" data-si-radius="26" aria-hidden="true"></div>
    <div class="si-plate__bg" data-si-tear="43" data-si-radius="26" aria-hidden="true"></div>
    <div class="si-figure"><canvas id="lab-fig" role="img" aria-label="A generated head drawn in dots"></canvas></div>
    <div class="si-eq" aria-hidden="true">v += <i data-si-eq="k">0.045</i>·(x₀ − x) + F &nbsp; v *= <i data-si-eq="c">0.85</i></div>
    <details class="si-lab" id="lab" open>
      <summary>Lab controls</summary>
      <div class="si-lab__body">
        <label for="lk">Spring k</label><input type="range" id="lk" data-si-lab="k" min="0.005" max="0.15" step="0.005" value="0.045"><output data-si-out="k" for="lk">0.045</output>
        <label for="lc">Damping c</label><input type="range" id="lc" data-si-lab="c" min="0.6" max="0.98" step="0.01" value="0.85"><output data-si-out="c" for="lc">0.85</output>
        <label for="lr">Push radius R</label><input type="range" id="lr" data-si-lab="r" min="20" max="140" step="1" value="54"><output data-si-out="r" for="lr">54px</output>
        <div class="si-lab__actions"><button type="button" data-si-act="scatter">Scatter</button><button type="button" data-si-act="reset">Reset</button></div>
      </div>
    </details>
    <figcaption><b>Fig. 1</b>Drag the sliders, then scatter.</figcaption>
  </figure>
</div>
<script>
StudioInk.init();
var s=7,rnd=function(){s=s*16807%2147483647;return s/2147483647},pts=[],face=function(x,y){var u=(x-150)/80,v=(y-205)/105;return u*u+v*v};
for(var i=0;i<30000&&pts.length<2600;i++){var x=60+rnd()*180,y=95+rnd()*220;if(face(x,y)>1)continue;var u=(x-150)/80,v=(y-205)/105,nz=Math.sqrt(Math.max(0,1-u*u-v*v)),light=Math.max(0,-u*.55-v*.45+nz*.7),d=Math.min(.59,Math.max(0,.62-.5*light));if(rnd()>d+.3)continue;pts.push([x,y,d])}
var blob=function(cx,cy,rx,ry,n,d){for(var i=0;i<n;i++){var a=rnd()*6.283,r=Math.sqrt(rnd());pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r,d+rnd()*.1])}};
blob(122,196,14,7,70,.88);blob(178,196,14,7,70,.88);blob(122,177,21,4,55,.75);blob(178,177,21,4,55,.75);blob(150,264,26,4,70,.78);blob(150,234,7,11,26,.68);
for(var j=0;j<9000;j++){var hx=45+rnd()*210,hy=40+rnd()*180,hu=(hx-150)/98,hv=(hy-160)/118;if(hu*hu+hv*hv>1||face(hx,hy)<1||hy>205)continue;if(rnd()<.8)pts.push([hx,hy,.6+rnd()*.4])}
var fig=StudioInk.particleFigure(document.getElementById('lab-fig'),pts,{head:{cx:150,cy:160,ax:98,ay:118},isHair:function(x,y){return y<205&&face(x,y)>1}});
StudioInk.labControls(document.getElementById('lab'),fig);
</script>
